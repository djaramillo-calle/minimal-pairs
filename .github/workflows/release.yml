# Build, sign and publish Minimal Pairs.
#
# Every push to main (and every v* tag) produces a GitHub Release holding the
# APK, clips.zip (the clip pack; the app downloads it from
# releases/latest/download/clips.zip, so the asset name is fixed) and a
# versioned copy of the pack. Pull requests only build and upload the APK as a
# workflow artifact.
#
# The clip pack comes, in this order, from: the Actions cache (keyed by catalog
# version + voices; a partial render is cached too and completed next time),
# the previous release's clips-<catalog>.zip when it is a complete pack for the
# same catalog, an Azure render, or the committed placeholder. A placeholder
# release is never marked "latest", so releases/latest/download/clips.zip keeps
# serving the last real pack (and the app refuses a pack with complete:false).
# The APK bundles the whole pack when it is <= 40 MB, else the two
# highest-default-weight contrasts (docs/DESIGN.md "Clips").
#
# Secrets (all optional; the release notes say what was available):
#   AZURE_SPEECH_KEY, AZURE_SPEECH_REGION      render the clip pack
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                                              release signing (debug key otherwise); the key
#                                              password equals the keystore password (PKCS12)
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest   # Android SDK preinstalled at $ANDROID_HOME
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }

      - name: Checks (unit tests, script selftests, catalog)
        run: bash scripts/check.sh

      # ---- clip pack -------------------------------------------------------
      - name: Compute clip cache key
        id: key
        run: |
          VOICES_SHA=$(jq -c '.voices' data/catalog/catalog.json | sha256sum | cut -c1-16)
          echo "catalog=$(tr -d '[:space:]' < data/catalog/catalog-version.txt)" >> "$GITHUB_OUTPUT"
          echo "key=clips-$(tr -d '[:space:]' < data/catalog/catalog-version.txt)-$VOICES_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore rendered clip pack
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: clips
          key: ${{ steps.key.outputs.key }}
          # A previous run that failed part-way saved what it had rendered.
          restore-keys: ${{ steps.key.outputs.key }}-partial-

      - name: Restore the previous release's pack (when no complete pack is cached)
        env:
          CATALOG: ${{ steps.key.outputs.catalog }}
        run: |
          if [ -f clips/index.json ] && jq -e '.complete == true' clips/index.json >/dev/null; then
            echo "complete pack restored from cache"; exit 0
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/clips-$CATALOG.zip"
          if ! curl -fsSL --retry 3 -o prev.zip "$URL"; then
            echo "no clips-$CATALOG.zip on the latest release"; exit 0
          fi
          rm -rf prev && mkdir prev
          if unzip -q prev.zip -d prev \
             && jq -e --arg c "$CATALOG" '.complete == true and .catalog_version == $c' prev/index.json >/dev/null; then
            rm -rf clips && mv prev clips
            echo "restored the previous release's complete pack for catalog $CATALOG"
          else
            echo "the previous release's clips-$CATALOG.zip is not a complete pack for catalog $CATALOG; ignoring it"
            rm -rf prev
          fi
          rm -f prev.zip

      - name: Render clip pack with Azure (only what is missing, and only when secrets exist)
        id: render
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          if [ -f clips/index.json ] && jq -e '.complete == true' clips/index.json >/dev/null; then
            echo "pack is complete; nothing to render"; exit 0
          fi
          if [ -z "$AZURE_SPEECH_KEY" ] || [ -z "$AZURE_SPEECH_REGION" ]; then
            echo "Azure secrets not set; skipping render"; exit 0
          fi
          echo "rendered=true" >> "$GITHUB_OUTPUT"   # written first: it must survive a failure below
          # The script keeps existing clips and fetches only the missing ones, so
          # a second pass retries just the clips that failed in the first.
          python3 scripts/render-clips.py --out clips || python3 scripts/render-clips.py --out clips

      - name: Inspect the pack
        id: inspect
        if: always()
        run: |
          if [ -f clips/index.json ]; then C=$(jq -r '.complete' clips/index.json); else C=none; fi
          echo "complete=$C" >> "$GITHUB_OUTPUT"
          echo "pack complete: $C"

      - name: Save the complete pack to cache
        if: steps.restore.outputs.cache-hit != 'true' && steps.inspect.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with: { path: clips, key: "${{ steps.key.outputs.key }}" }

      - name: Save a partial render to cache (so a failed run's clips are not rendered again)
        # Runs even when the render step failed; the next run restores it through
        # restore-keys and renders only what is still missing.
        if: always() && steps.render.outputs.rendered == 'true' && steps.inspect.outputs.complete == 'false'
        uses: actions/cache/save@v4
        with: { path: clips, key: "${{ steps.key.outputs.key }}-partial-${{ github.run_id }}" }

      - name: Install pack into app assets (placeholder if there is no complete pack)
        id: pack
        run: |
          PACK=full
          if ! { [ -f clips/index.json ] && jq -e '.complete == true' clips/index.json >/dev/null; }; then
            echo "No complete rendered pack; using data/placeholder-clips"
            rm -rf clips && cp -r data/placeholder-clips/clips clips && PACK=placeholder
          fi
          rm -rf app/src/main/assets/clips && mkdir -p app/src/main/assets
          MB=$(( $(jq '.bytes' clips/index.json) / 1000000 ))
          if [ "$PACK" = placeholder ]; then
            cp -r clips app/src/main/assets/clips
            BUNDLED=placeholder
          elif [ "$MB" -le 40 ]; then
            # docs/DESIGN.md: a pack of at most 40 MB is bundled whole.
            python3 scripts/render-clips.py --out clips --install-assets
            BUNDLED=whole
          else
            # Above 40 MB only the two highest-default-weight contrasts go into
            # the APK; the whole pack ships as clips.zip (--install-assets writes
            # a partial index.json with "complete": false).
            BUNDLED=$(python3 -c "import json; cs=[c for c in json.load(open('data/catalog/catalog.json'))['contrasts'] if c.get('trainable')]; cs.sort(key=lambda c: -c['default_weight']); print(','.join(c['id'] for c in cs[:2]))")
            python3 scripts/render-clips.py --out clips --install-assets --contrasts "$BUNDLED"
          fi
          test -f app/src/main/assets/clips/index.json || { echo "assets install failed"; exit 1; }
          (cd clips && zip -qr ../clips.zip .)
          cp clips.zip "clips-${{ steps.key.outputs.catalog }}.zip"
          echo "mode=$PACK" >> "$GITHUB_OUTPUT"
          echo "bundled=$BUNDLED" >> "$GITHUB_OUTPUT"
          echo "files=$(find clips -name '*.webm' -type f | wc -l)" >> "$GITHUB_OUTPUT"
          echo "mb=$MB" >> "$GITHUB_OUTPUT"

      # ---- APK --------------------------------------------------------------
      - name: Build release APK
        id: apk
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGNED=debug
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"   # app/build.gradle.kts reads these
            SIGNED=release
          fi
          echo "Signing mode: $SIGNED"
          ./gradlew --no-daemon assembleRelease
          APK=$(find app/build/outputs/apk/release -name 'minimal-pairs-*.apk' | head -n1)
          test -n "$APK" || { echo "no APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "APK: $APK ($(du -h "$APK" | cut -f1)), sha256 $(sha256sum "$APK" | cut -d' ' -f1)"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with: { name: apk, path: "${{ steps.apk.outputs.path }}" }

      # ---- release ----------------------------------------------------------
      - name: Release notes and tag
        if: github.event_name != 'pull_request'
        id: notes
        env:
          SIGNED: ${{ steps.apk.outputs.signed }}
          PACK: ${{ steps.pack.outputs.mode }}
          BUNDLED: ${{ steps.pack.outputs.bundled }}
          FILES: ${{ steps.pack.outputs.files }}
          MB: ${{ steps.pack.outputs.mb }}
          CATALOG: ${{ steps.key.outputs.catalog }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          {
            echo "Built $(date -u +%Y-%m-%dT%H:%M:%SZ) from commit ${GITHUB_SHA::12}."; echo
            echo "APK: \`$(basename "$APK")\`, $(du -h "$APK" | cut -f1), sha256 \`$(sha256sum "$APK" | cut -d' ' -f1)\`."
            if [ "$SIGNED" = release ]; then echo "Signed with the release key."; else
              echo "Signed with a debug key: Android will ask to uninstall a previously installed release-signed build before installing this one."; fi
            echo
            if [ "$PACK" = placeholder ]; then
              echo "Clip pack: **PLACEHOLDER** ($FILES clips, \`\"complete\": false\`), catalog $CATALOG. No rendered pack was"
              echo "available to this build (no Azure secrets, no cached render, no complete pack on the previous release)."
              echo "This release is not marked latest, so the app keeps downloading the last real \`clips.zip\`;"
              echo "do not install the placeholder \`clips.zip\` of this release by hand."
            else
              echo "Clip pack: full, $FILES clips, $MB MB, catalog $CATALOG (\`clips.zip\`)."
              if [ "$BUNDLED" = whole ]; then echo "The APK bundles the whole pack."; else
                echo "The APK bundles the contrasts $BUNDLED; the app downloads the rest from \`clips.zip\`."; fi
            fi
            echo "Contrasts:"
            python3 -c "import json; [print('- %s (%s): %d pairs' % (c['id'], c['label'], len(c['pairs']))) for c in json.load(open('data/catalog/catalog.json'))['contrasts']]"
          } > release-notes.md
          cat release-notes.md
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else
            VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
            TAG="v${VERSION:-0.0.0}-build.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Minimal Pairs ${{ steps.notes.outputs.tag }}
          body_path: release-notes.md
          prerelease: false
          # A placeholder release must not take over releases/latest/download/clips.zip.
          make_latest: ${{ steps.pack.outputs.mode == 'placeholder' && 'false' || 'true' }}
          files: |
            ${{ steps.apk.outputs.path }}
            clips.zip
            clips-${{ steps.key.outputs.catalog }}.zip
